<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>声音管理 | Spark Voice Studio</title>
  <style>
    :root {
      --background: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #f9fafb;
      --foreground: #172033;
      --muted: #5c6575;
      --border: #dce1e8;
      --border-strong: #c5ccd6;
      --primary: #b42318;
      --primary-hover: #912018;
      --primary-soft: #fff1f0;
      --accent: #2457c5;
      --accent-soft: #eef4ff;
      --success: #067647;
      --error: #b42318;
      --shadow: 0 18px 50px rgba(23, 32, 51, 0.08);
      --radius: 16px;
      --font: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--foreground);
      background:
        radial-gradient(circle at 10% -10%, rgba(180, 35, 24, 0.07), transparent 32rem),
        radial-gradient(circle at 95% 5%, rgba(36, 87, 197, 0.06), transparent 28rem),
        var(--background);
      font-family: var(--font);
      line-height: 1.55;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    :focus-visible {
      outline: 3px solid rgba(36, 87, 197, 0.38);
      outline-offset: 3px;
    }

    .shell {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 44px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--foreground);
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: #fff;
      background: var(--primary);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
    }

    .header-actions { display: flex; align-items: center; gap: 16px; }

    .text-link {
      color: var(--accent);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }

    .text-link:hover { text-decoration: underline; text-underline-offset: 4px; }

    .intro { padding: 58px 0 28px; }

    .eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 12px;
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    .intro p {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .panel {
      margin-top: 18px;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h2 { margin: 0; font-size: 20px; letter-spacing: -0.025em; }

    .subtext {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field span { font-size: 13px; font-weight: 650; }

    input[type="text"],
    input[type="password"],
    input[type="file"],
    textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      color: var(--foreground);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
    }

    textarea { min-height: 88px; resize: vertical; }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(36, 87, 197, 0.12);
      outline: none;
    }

    .button-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .primary,
    .secondary,
    .danger {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .primary {
      color: #fff;
      background: var(--primary);
      border: 1px solid var(--primary);
    }

    .primary:hover { background: var(--primary-hover); }

    .secondary {
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid #cfdcff;
    }

    .danger {
      color: var(--error);
      background: var(--primary-soft);
      border: 1px solid #f0bbb7;
    }

    button:disabled { cursor: wait; opacity: 0.62; }

    .message {
      min-height: 22px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .message.error { color: var(--error); }

    .voice-list {
      display: grid;
      gap: 14px;
    }

    .voice-card {
      padding: 18px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .voice-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .voice-head h3 { margin: 0; font-size: 17px; }

    .voice-id {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }

    .voice-meta {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    .replace-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-top: 12px;
    }

    .empty {
      padding: 30px;
      color: var(--muted);
      text-align: center;
      background: var(--surface-soft);
      border: 1px dashed var(--border-strong);
      border-radius: 12px;
    }

    .access-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 1080px); padding-top: 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .intro { padding-top: 38px; }
      .panel { padding: 20px; }
      .form-grid, .replace-row, .access-row { grid-template-columns: 1fr; }
      .voice-head { flex-direction: column; }
      .voice-meta { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">V</span>
        Spark Voice Studio
      </a>
      <nav class="header-actions" aria-label="页面导航">
        <a class="text-link" href="/">返回语音合成</a>
        <a class="text-link" href="/docs" target="_blank" rel="noreferrer">API 文档</a>
      </nav>
    </header>

    <main>
      <section class="intro">
        <span class="eyebrow">Voice library</span>
        <h1>声音管理</h1>
        <p>管理参考音频、显示名称和参考文本。合成接口既可以使用 voice ID，也可以使用唯一的显示名称。</p>
      </section>

      <section class="panel" aria-labelledby="accessHeading">
        <div class="panel-heading">
          <div>
            <h2 id="accessHeading">服务连接</h2>
            <p class="subtext">服务启用鉴权时填写访问密钥。</p>
          </div>
        </div>
        <div class="access-row">
          <input id="apiKey" type="password" autocomplete="off" placeholder="SPARK_TTS_API_KEY">
          <button class="secondary" id="reloadButton" type="button">刷新声音列表</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="uploadHeading">
        <div class="panel-heading">
          <div>
            <h2 id="uploadHeading">新增声音</h2>
            <p class="subtext">支持 WAV、MP3、M4A、OGG、WebM 和 FLAC，最大 20 MB。</p>
          </div>
        </div>
        <form id="uploadForm">
          <div class="form-grid">
            <label class="field">
              <span>参考音频</span>
              <input id="newAudio" type="file" name="audio" accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm,.flac" required>
            </label>
            <label class="field">
              <span>显示名称</span>
              <input id="newName" type="text" name="name" maxlength="120" placeholder="留空则使用文件名">
            </label>
            <label class="field full">
              <span>参考文本（推荐）</span>
              <textarea id="newPromptText" name="prompt_text" maxlength="2000" placeholder="准确填写参考音频里说的话"></textarea>
            </label>
          </div>
          <div class="button-row">
            <button class="primary" id="uploadButton" type="submit">上传声音</button>
          </div>
        </form>
        <p class="message" id="statusMessage" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="voicesHeading">
        <div class="panel-heading">
          <div>
            <h2 id="voicesHeading">已有声音</h2>
            <p class="subtext">名称用于合成接口的 voice 参数；重名时需要改用 ID。</p>
          </div>
        </div>
        <div class="voice-list" id="voiceList"></div>
      </section>
    </main>
  </div>

  <script>
    const apiKey = document.getElementById("apiKey");
    const reloadButton = document.getElementById("reloadButton");
    const uploadForm = document.getElementById("uploadForm");
    const uploadButton = document.getElementById("uploadButton");
    const newAudio = document.getElementById("newAudio");
    const newName = document.getElementById("newName");
    const newPromptText = document.getElementById("newPromptText");
    const statusMessage = document.getElementById("statusMessage");
    const voiceList = document.getElementById("voiceList");

    function authHeaders(extra = {}) {
      const headers = { ...extra };
      if (apiKey.value.trim()) {
        headers.Authorization = `Bearer ${apiKey.value.trim()}`;
      }
      return headers;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function showStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.classList.toggle("error", isError);
    }

    async function readError(response) {
      try {
        const payload = await response.json();
        return payload?.error?.message || payload?.detail || `请求失败（${response.status}）`;
      } catch {
        return `请求失败（${response.status}）`;
      }
    }

    async function apiFetch(url, options = {}) {
      const headers = authHeaders(options.headers || {});
      const response = await fetch(url, { ...options, headers });
      if (!response.ok) {
        throw new Error(await readError(response));
      }
      return response;
    }

    function renderVoices(voices) {
      if (!voices.length) {
        voiceList.innerHTML = '<div class="empty">还没有声音，请先上传参考音频。</div>';
        return;
      }
      voiceList.innerHTML = voices.map((voice) => {
        const duration = Number(voice.duration_seconds);
        const durationLabel = Number.isFinite(duration)
          ? `${duration.toFixed(2)} 秒`
          : "时长未知";
        return `
        <article class="voice-card" data-id="${escapeHtml(voice.id)}">
          <div class="voice-head">
            <div>
              <h3>${escapeHtml(voice.name)}</h3>
              <code class="voice-id">${escapeHtml(voice.id)}</code>
            </div>
            <div class="voice-meta">
              <span>${durationLabel}</span>
              <br>
              <span>${escapeHtml(voice.created_at || "")}</span>
            </div>
          </div>
          <div class="form-grid">
            <label class="field">
              <span>显示名称</span>
              <input class="edit-name" type="text" maxlength="120" value="${escapeHtml(voice.name)}">
            </label>
            <label class="field full">
              <span>参考文本</span>
              <textarea class="edit-prompt" maxlength="2000">${escapeHtml(voice.prompt_text)}</textarea>
            </label>
          </div>
          <div class="card-actions">
            <button class="primary" type="button" data-action="save">保存元数据</button>
            <button class="secondary" type="button" data-action="preview">加载试听</button>
            <button class="danger" type="button" data-action="delete">删除声音</button>
          </div>
          <div class="preview-container"></div>
          <div class="replace-row">
            <input class="replacement-audio" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm,.flac">
            <button class="secondary" type="button" data-action="replace">替换音频</button>
          </div>
        </article>
      `;
      }).join("");
    }

    async function loadVoices() {
      showStatus("正在加载声音列表…");
      try {
        const response = await apiFetch("/api/voices");
        const payload = await response.json();
        renderVoices(payload.data || []);
        showStatus(`共 ${(payload.data || []).length} 个声音。`);
      } catch (error) {
        renderVoices([]);
        showStatus(error.message, true);
      }
    }

    uploadForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = newAudio.files?.[0];
      if (!file) {
        showStatus("请选择参考音频。", true);
        return;
      }
      const data = new FormData();
      data.append("audio", file, file.name);
      data.append("name", newName.value.trim());
      data.append("prompt_text", newPromptText.value.trim());
      uploadButton.disabled = true;
      showStatus("正在上传并处理参考音频…");
      try {
        await apiFetch("/api/voices", { method: "POST", body: data });
        uploadForm.reset();
        await loadVoices();
        showStatus("声音已创建。");
      } catch (error) {
        showStatus(error.message, true);
      } finally {
        uploadButton.disabled = false;
      }
    });

    voiceList.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const card = button.closest(".voice-card");
      const voiceId = card?.dataset.id;
      if (!card || !voiceId) return;
      const action = button.dataset.action;

      try {
        if (action === "save") {
          const name = card.querySelector(".edit-name").value.trim();
          const promptText = card.querySelector(".edit-prompt").value;
          button.disabled = true;
          await apiFetch(`/api/voices/${encodeURIComponent(voiceId)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, prompt_text: promptText })
          });
          await loadVoices();
          showStatus("元数据已保存。");
        } else if (action === "delete") {
          if (!window.confirm(`确定删除声音“${voiceId}”吗？此操作不可恢复。`)) return;
          button.disabled = true;
          await apiFetch(`/api/voices/${encodeURIComponent(voiceId)}`, { method: "DELETE" });
          await loadVoices();
          showStatus("声音已删除。");
        } else if (action === "replace") {
          const file = card.querySelector(".replacement-audio").files?.[0];
          if (!file) {
            showStatus("请选择用于替换的音频文件。", true);
            return;
          }
          button.disabled = true;
          const data = new FormData();
          data.append("audio", file, file.name);
          await apiFetch(`/api/voices/${encodeURIComponent(voiceId)}/audio`, {
            method: "PUT",
            body: data
          });
          await loadVoices();
          showStatus("参考音频已替换。");
        } else if (action === "preview") {
          button.disabled = true;
          const response = await apiFetch(
            `/api/voices/${encodeURIComponent(voiceId)}/audio`
          );
          const blob = await response.blob();
          const container = card.querySelector(".preview-container");
          const previous = container.querySelector("audio");
          if (previous?.src) URL.revokeObjectURL(previous.src);
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = URL.createObjectURL(blob);
          container.replaceChildren(audio);
          button.disabled = false;
        }
      } catch (error) {
        button.disabled = false;
        showStatus(error.message, true);
      }
    });

    reloadButton.addEventListener("click", loadVoices);
    apiKey.addEventListener("change", loadVoices);

    fetch("/healthz")
      .then((response) => response.json())
      .then(() => loadVoices())
      .catch(() => showStatus("服务未连接。", true));
  </script>
</body>
</html>
